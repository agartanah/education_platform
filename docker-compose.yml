version: '3.8'

services:
  # MongoDB база данных
  mongodb:
    image: mongo:7-jammy
    container_name: education_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: education
    volumes:
      - mongodb_data:/data/db
    networks:
      - education_network

  # RabbitMQ для обмена сообщениями между сервисами
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: education_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP порт
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - education_network

  # User Service
  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: education_user_service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/education?authSource=admin
      PORT: 3001
      JWT_SECRET: aboba
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - education_network

  # Course Service
  course-service:
    build:
      context: .
      dockerfile: ./course-service/Dockerfile
    container_name: education_course_service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/education?authSource=admin
      PORT: 3002
      JWT_SECRET: aboba
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    volumes:
      - course_images:/app/images
      - course_videos:/app/videos
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - education_network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: education_api_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      COURSE_SERVICE_URL: http://course-service:3002
    depends_on:
      - user-service
      - course-service
    networks:
      - education_network

volumes:
  mongodb_data:
    driver: local
  rabbitmq_data:
    driver: local
  course_images:
    driver: local
  course_videos:
    driver: local

networks:
  education_network:
    driver: bridge